# Reusable: build one image and publish it to the Iberico registry.
#
#   jobs:
#     image:
#       uses: iberico-lab/iberico-lab/.github/workflows/docker-publish.yml@v1
#       with:
#         image: asset-api
#         tags: v1.2.3,latest
#         build-args: |
#           VERSION=v1.2.3
#       secrets: inherit
#
# The image is built to an OCI archive by buildx and pushed with regctl in 50 MB chunks
# (Cloudflare rejects a request body over 100 MB). Needs REGISTRY_USERNAME and REGISTRY_PASSWORD.
# No QEMU: the Dockerfile must cross-compile on $BUILDPLATFORM rather than run under emulation.
#
# Repos whose build is more than `docker buildx build` (bake graphs, reusing a previous release's
# image) should use the `registry-login` and `oci-publish` actions directly instead.
name: docker-publish

on:
  workflow_call:
    inputs:
      image:
        description: Image name under the namespace, e.g. asset-api.
        required: true
        type: string
      tags:
        description: Comma-separated tags. The first is pushed, the rest are server-side copies.
        required: true
        type: string
      namespace:
        description: Registry namespace.
        type: string
        default: iberico-lab
      registry:
        type: string
        default: registry.mediumrare.ai
      ref:
        description: Git ref to build. Defaults to the triggering ref.
        type: string
        default: ''
      context:
        type: string
        default: .
      dockerfile:
        type: string
        default: Dockerfile
      platforms:
        type: string
        default: linux/amd64,linux/arm64
      build-args:
        description: Newline-separated KEY=VALUE build arguments.
        type: string
        default: ''
      cache-scope:
        description: GitHub Actions cache scope. Defaults to the image name.
        type: string
        default: ''
      runs-on:
        type: string
        default: ubuntu-24.04
    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true
    outputs:
      reference:
        description: The pushed image:tag.
        value: ${{ jobs.publish.outputs.reference }}

permissions:
  contents: read

jobs:
  publish:
    name: ${{ inputs.image }}
    runs-on: ${{ inputs.runs-on }}
    outputs:
      reference: ${{ steps.push.outputs.reference }}
    steps:
      # Credentials first: a missing secret fails here, before the build.
      - uses: iberico-lab/iberico-lab/actions/registry-login@v1
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the OCI archive
        env:
          IMAGE: ${{ inputs.image }}
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          PLATFORMS: ${{ inputs.platforms }}
          BUILD_ARGS: ${{ inputs.build-args }}
          CACHE_SCOPE: ${{ inputs.cache-scope || inputs.image }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r line; do
            [ -n "${line}" ] && args+=(--build-arg "${line}")
          done <<< "${BUILD_ARGS}"
          mkdir -p oci
          docker buildx build \
            --platform "${PLATFORMS}" \
            -f "${DOCKERFILE}" \
            "${args[@]}" \
            --cache-from "type=gha,scope=${CACHE_SCOPE}" \
            --cache-to "type=gha,mode=max,scope=${CACHE_SCOPE}" \
            --provenance=false --sbom=false \
            --output "type=oci,dest=oci/${IMAGE}.tar" \
            "${CONTEXT}"

      - name: Push
        id: push
        uses: iberico-lab/iberico-lab/actions/oci-publish@v1
        with:
          image: ${{ inputs.registry }}/${{ inputs.namespace }}/${{ inputs.image }}
          tags: ${{ inputs.tags }}
          archive: oci/${{ inputs.image }}.tar
